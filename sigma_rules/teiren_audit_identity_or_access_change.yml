# R13
title: "Teiren Identity Or Access Change"
id: "3dff7985-20ca-445e-9cbe-75304426f7b9"
status: "experimental"
description: "Detects Teiren audit events classified by the project as identity or access changes."
references:
    - "https://github.com/SigmaHQ/sigma/blob/8a4813404ea3074890e0cda9272d4d1a8b2941d6/rules/cloud/azure/audit_logs/azure_ad_account_created_deleted.yml"
author: "TEIREN Security Log Cross Analysis Team"
date: "2026-10-12"
logsource:
    product: "teiren"
    service: "audit"
    definition: "Project-specific Teiren audit log; event_action and action_category are derived by this repository and need a custom mapping."
detection:
    selection:
        action_category: "iam_change"
    condition: "selection"
fields:
    - "event_action"
    - "action_category"
    - "request"
    - "account"
falsepositives:
    - "Approved user lifecycle and policy management."
level: "high"
