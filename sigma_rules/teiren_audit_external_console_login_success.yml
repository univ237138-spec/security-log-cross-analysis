# R11
title: "Teiren Console Login Success From External Address"
id: "859747ca-ad0f-4478-9454-cb02ed693fe0"
status: "experimental"
description: "Detects a Teiren console login event from an address classified as external by the project network inventory."
author: "TEIREN Security Log Cross Analysis Team"
date: "2026-10-12"
logsource:
    product: "teiren"
    service: "audit"
    definition: "Project-specific Teiren audit log; event_action and action_category are derived by this repository and need a custom mapping."
detection:
    selection:
        event_action:
            - "IAM_LOGIN_SUCCESS"
            - "IAM_LOGIN_NEW_DEVICE"
            - "ROOT_LOGIN_NO_MFA"
        client_zone: "external"
    condition: "selection"
fields:
    - "client_ip"
    - "account"
    - "client_zone"
    - "event_action"
falsepositives:
    - "Approved remote console access."
level: "medium"
