# R11
title: "SSH Login Success From External Address"
id: "6e74a0ba-6dfa-4eec-a4f1-62c70857036b"
status: "experimental"
description: "Detects a successful SSH authentication from an address classified as external by the project network inventory."
author: "TEIREN Security Log Cross Analysis Team"
date: "2026-10-12"
logsource:
    product: "linux"
    service: "sshd"
    definition: "Project-normalized sshd events; event_action, client_ip, account and client_zone are parser/enrichment fields."
detection:
    selection:
        event_action: "auth_success"
        client_zone: "external"
    condition: "selection"
fields:
    - "client_ip"
    - "account"
    - "client_zone"
    - "event_action"
falsepositives:
    - "Approved remote administration."
level: "medium"
