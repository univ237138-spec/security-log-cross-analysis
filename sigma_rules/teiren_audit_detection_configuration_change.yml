# R12
title: "Teiren Detection Configuration Change"
id: "9e7fd1cb-3739-4358-bf07-c3e48dfb6c2f"
status: "experimental"
description: "Detects Teiren audit events classified by the project as changes to detection configuration."
references:
    - "https://github.com/SigmaHQ/sigma/blob/8a4813404ea3074890e0cda9272d4d1a8b2941d6/rules/cloud/aws/cloudtrail/aws_cloudtrail_guardduty_detector_deleted_or_updated.yml"
author: "TEIREN Security Log Cross Analysis Team"
date: "2026-10-12"
tags:
    - "attack.defense-impairment"
    - "attack.t1685"
logsource:
    product: "teiren"
    service: "audit"
    definition: "Project-specific Teiren audit log; event_action and action_category are derived by this repository and need a custom mapping."
detection:
    selection:
        action_category: "detection_config"
    condition: "selection"
fields:
    - "event_action"
    - "action_category"
    - "request"
    - "account"
falsepositives:
    - "Authorized detection rule administration."
level: "high"
