# R03
title: "Server Process Connects To External Address"
id: "3953bd8f-d197-4254-b07d-707e64f09ef5"
status: "experimental"
description: "Detects any Sysmon for Linux network connection classified as external by the project network inventory."
author: "TEIREN Security Log Cross Analysis Team"
date: "2026-10-12"
logsource:
    product: "linux"
    category: "network_connection"
    definition: "Sysmon for Linux network connection; project enrichment supplies dst_zone and host."
detection:
    selection:
        dst_zone: "external"
    condition: "selection"
fields:
    - "Image"
    - "DestinationIp"
    - "DestinationPort"
    - "dst_zone"
    - "host"
falsepositives:
    - "Routine software updates, API calls and monitoring traffic."
level: "medium"
