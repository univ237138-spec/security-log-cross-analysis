# R04 비표준 포트로 외부 연결
# docs/06_탐지규칙_Sigma_대조.yaml 을 규칙별로 나눈 파일이다. 필드 이름과 추가 필드의 뜻은 그 파일 머리말에 있다.

title: R04 비표준 포트로 외부 연결
id: 117f05f0-f3f2-4cda-91c1-a91e2f83dc01
name: r04_outbound_nonstandard_port
related:
    - id: dbfc7c98-04ab-4ab7-aa94-c74d22aa7376 # Potentially Suspicious Malware Callback Communication - Linux (Sigma 등급 high)
      type: similar
status: experimental
description: 서버에서 외부로 나가는 연결 중 목적지 포트가 80이나 443이 아닌 것을 탐지한다.
references:
    - docs/06_탐지_위험점수.md
    - https://github.com/SigmaHQ/sigma/blob/8a4813404ea3074890e0cda9272d4d1a8b2941d6/rules/linux/network_connection/net_connection_lnx_susp_malware_callback_port.yml
author: security-log-cross-analysis 프로젝트 팀
date: 2026-10-03
tags:
    - attack.command-and-control
    - attack.t1571
logsource:
    category: network_connection
    product: linux
detection:
    selection:
        dst_zone: 'external' # 보강 컬럼
    filter_main_web_ports:
        dpt:
            - 80
            - 443
    condition: selection and not 1 of filter_main_*
falsepositives:
    - 80·443 외의 포트를 쓰는 정상 외부 서비스 (이 데이터의 정상 세션에서는 0건)
level: high
project_rule_id: R04
project_hits: 1
sigma_match_level: 변형
sigma_difference: Sigma는 악성코드가 자주 쓰는 포트 10개 목록(4444 포함)과 사설 IP 제외 조건을 쓴다. 이 프로젝트는 외부로 가는 80·443 외 모든 포트를 잡는다. Sigma 룰은 Initiated 필드를 쓰는데 이 데이터에는 그 필드가 없다.
sigma_original_hits: 1
sigma_original_note: 같다 (S137의 4444번 포트).
