# R11 외부 IP에서 로그인 성공
# docs/06_탐지규칙_Sigma_대조.yaml 을 규칙별로 나눈 파일이다. 필드 이름과 추가 필드의 뜻은 그 파일 머리말에 있다.
# 이 파일에는 문서가 2개 있다: 로그 종류별 룰.

title: R11 외부 IP에서 로그인 성공 (SSH)
id: 33183c6e-a379-4d58-aa73-c0f86f9508f5
name: r11_external_login_ssh
status: experimental
description: SSH 로그인 성공의 접속 IP가 조직 밖이면 탐지한다. R11은 콘솔 로그인도 함께 보며, 그쪽은 다음 문서에 있다.
references:
    - docs/06_탐지_위험점수.md
author: security-log-cross-analysis 프로젝트 팀
date: 2026-10-03
tags:
    - attack.initial-access
    - attack.t1078
    - attack.t1133
logsource:
    product: linux
    service: sshd
detection:
    selection:
        event_action: 'auth_success'
        client_zone: 'external' # 보강 컬럼: 접속 IP가 조직 밖인지
    condition: selection
falsepositives:
    - 재택이나 출장 중의 정상 접속 (이 데이터의 정상 세션에서는 0건)
level: medium
project_rule_id: R11
project_hits: 1
sigma_match_level: 대응 룰 없음
sigma_difference: 외부와 내부를 나누려면 조직의 IP 대역 정보가 있어야 해서 일반 룰로 만들 수 없다. 이 프로젝트는 보강 단계에서 만든 client_zone을 쓴다.
---
title: R11 외부 IP에서 로그인 성공 (콘솔)
id: b13df35d-1bdf-45cb-a6e4-c7c510236f36
name: r11_external_login_console
status: experimental
description: 테이렌 콘솔 로그인 성공의 접속 IP가 조직 밖이면 탐지한다. R11의 SSH 쪽은 앞 문서에 있다.
references:
    - docs/06_탐지_위험점수.md
author: security-log-cross-analysis 프로젝트 팀
date: 2026-10-03
tags:
    - attack.initial-access
    - attack.t1078
    - attack.t1133
logsource:
    product: teiren
    service: audit
detection:
    selection:
        event_action:
            - 'IAM_LOGIN_SUCCESS'
            - 'IAM_LOGIN_NEW_DEVICE'
            - 'ROOT_LOGIN_NO_MFA'
        client_zone: 'external' # 보강 컬럼
    condition: selection
falsepositives:
    - 재택이나 출장 중의 정상 접속 (이 데이터의 정상 세션에서는 0건)
level: medium
project_rule_id: R11
project_hits: 1
sigma_match_level: 대응 룰 없음
sigma_difference: 외부와 내부를 나누려면 조직의 IP 대역 정보가 있어야 해서 일반 룰로 만들 수 없다. 이 프로젝트는 보강 단계에서 만든 client_zone을 쓴다.
