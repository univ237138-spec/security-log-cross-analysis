해석할_때_주의할_점:
  - "Sigma 원본이 놓친 것을 프로젝트 규칙이 잡았다고 해서 프로젝트 규칙이 더 좋다는 뜻은 아니다. 프로젝트 규칙은 이 데이터에 그런 행동이 있다는 것을 알고 일반화한 것이다."
  - "문자열 일치 룰은 표기에 약하다. 따옴표 하나, 경로 유무(curl과 /usr/bin/curl) 때문에 Sigma 룰이 빗나갔고, 같은 일이 프로젝트 규칙에도 생길 수 있다."
  - "감사로그 규칙(R12, R13, R16)은 테이렌용 공개 룰이 없어, 같은 행위를 보는 클라우드 감사로그(AWS CloudTrail, Azure) 룰과 개념만 대응시켰다."
  - "'16개 규칙이 Sigma를 반영했다'고 말하면 부정확하다. '5개는 Sigma와 조건이 비슷하고, 5개는 개념만 대응하며, 6개는 자체 제작이다'가 정확하다."

남은_확인_사항:
  - 항목: "ATT&CK 버전 명시"
    내용: "대조한 커밋의 SigmaHQ 룰에는 T1562 태그가 0건이고 T1685 계열 태그가 198건 있다. R12와 비슷한 GuardDuty 룰도 T1685.002, 전술 defense-impairment로 붙어 있다. 그래서 R12에 쓴 T1562.001(Defense Evasion)은 최신 ATT&CK과 다를 수 있다. 위험점수 단계가 전술 수를 경보 조건으로 쓰므로, 사용한 ATT&CK 버전을 문서에 밝혀야 한다."
    추가_확인: "2026-10-12에 attack.mitre.org를 확인한 결과, 최신 버전(v19.2)의 Enterprise 전술은 15가지이고 Defense Evasion 대신 Stealth와 Defense Impairment가 있다."
