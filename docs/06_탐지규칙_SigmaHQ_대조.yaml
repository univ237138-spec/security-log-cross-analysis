# 탐지 규칙 R01~R16과 SigmaHQ 룰의 대응 관계
#
# 이 파일은 docs/06_탐지_위험점수.md 의 "5단계 룰 R01~R16과 SigmaHQ 룰 대조표"(2026-10-07)를
# 규칙별로 읽기 쉽게 옮긴 것이다. 새로 분석한 내용은 없고, 탐지 건수는
# data/09_detections/detections.csv 에서 센 값이다.
#
# 먼저 알아둘 것: 16개가 모두 Sigma 룰을 가져온 것은 아니다.
# Sigma와 조건까지 비슷한 규칙은 5개이고, 나머지 11개는 이 프로젝트에서 정의했다.

문서:
  제목: "탐지 규칙 16개와 Sigma 룰 대조"
  작성일: 2026-10-12
  근거_문서: "docs/06_탐지_위험점수.md"
  규칙_정의_파일: "data/09_detections/detection_rules.csv"
  규칙_코드: "scripts/09_detect.py"

sigma_기준:
  저장소: "https://github.com/SigmaHQ/sigma"
  커밋: "8a4813404ea3074890e0cda9272d4d1a8b2941d6"
  커밋_날짜: 2026-10-06
  대조한_날짜: 2026-10-07
  링크_앞부분: "https://github.com/SigmaHQ/sigma/blob/8a4813404ea3074890e0cda9272d4d1a8b2941d6/"
  설명: "아래 sigma_룰의 경로 앞에 링크_앞부분을 붙이면 대조한 시점의 룰 파일이 열린다."

만든_과정:
  - 순서: 1
    시점: "5단계 계획 (실행 전)"
    내용: "일반 공격 기법을 로그 필드 조건으로 옮겨 규칙 16개를 정의하고 실행 전에 고정했다. 특정 IP, 파일 이름, 계정은 조건에 넣지 않았다."
  - 순서: 2
    시점: "5단계 계획 (실행 전)"
    내용: "계획 문서에는 'Sigma에 있는 유형들이다'라고만 적었다. 규칙별로 어느 Sigma 룰에 해당하는지는 적지 않았다."
  - 순서: 3
    시점: "2026-10-07 (실행 후)"
    내용: "SigmaHQ 룰과 하나씩 대조했다. 위 문장이 16개 전체에 맞지 않는다는 것을 확인하고 계획 문서에 정정을 달았다. 규칙 정의와 실행 결과는 바꾸지 않았다."
  - 순서: 4
    시점: "2026-10-07 (실행 후)"
    내용: "대응하는 Sigma 룰의 원본 조건을 그대로 이 데이터에 적용해, 프로젝트 규칙과 탐지 건수를 비교했다."

대응_수준:
  거의_같음:
    뜻: "조건이 거의 같다"
    개수: 1
    규칙: [R08]
  변형:
    뜻: "같은 기법이지만 조건을 이 데이터에 맞게 바꿨다"
    개수: 4
    규칙: [R01, R02, R04, R07]
  개념만_같음:
    뜻: "같은 공격 기법이지만 로그 종류나 판단 방식이 다르다"
    개수: 5
    규칙: [R05, R06, R12, R13, R16]
  대응_룰_없음:
    뜻: "Sigma 저장소에 해당 룰이 없다 (자체 제작)"
    개수: 6
    규칙: [R03, R09, R10, R11, R14, R15]

요약:
  전체_규칙_수: 16
  sigma와_조건까지_비슷한_규칙_수: 5
  프로젝트에서_정의한_규칙_수: 11
  전체_탐지_건수: 45

규칙:
  - id: R01
    이름: "웹 서버 계정의 셸·다운로드 도구 실행"
    조건: "웹 서버 계정이 셸·curl·wget 실행"
    attck: [T1505.003, T1059.004]
    심각도: high
    로그: [sysmon]
    탐지_건수: 2
    대응_수준: 변형
    sigma_룰:
      - 제목: "Linux Webshell Indicators"
        id_앞자리: "818f7b24"
        경로: "rules/linux/process_creation/proc_creation_lnx_webshell_detection.yml"
    차이: "Sigma는 부모 프로세스가 웹 서버(nginx 등)이고 자식이 정찰 명령(whoami, ifconfig, cat 등)일 때 탐지한다. 이 프로젝트는 실행 계정이 웹 서버 계정이고 자식이 셸·curl·wget일 때 탐지한다."
    sigma_원본_적용:
      sigma_탐지_건수: 0
      차이가_난_이유: "부모는 /usr/sbin/nginx로 조건이 맞지만, 자식이 bash라서 정찰 명령 목록에 없다."

  - id: R02
    이름: "다운로드 후 바로 실행"
    조건: "curl/wget 출력을 셸로 파이프"
    attck: [T1059.004, T1105]
    심각도: high
    로그: [sysmon]
    탐지_건수: 2
    대응_수준: 변형
    sigma_룰:
      - 제목: "Linux Shell Pipe to Shell"
        id_앞자리: "880973f3"
        경로: "rules/linux/process_creation/proc_creation_lnx_susp_pipe_shell.yml"
      - 제목: "Suspicious Download and Execute Pattern via Curl/Wget"
        id_앞자리: "a2d9e2f3"
        경로: "rules/linux/process_creation/proc_creation_lnx_curl_wget_exec_tmp.yml"
    차이: "첫째 룰은 'bash -c'로 시작하고 '| bash'로 끝나는 문자열을 찾는다. 둘째 룰은 '/curl'(경로 포함), '/tmp/', 'sh -c'가 모두 있어야 한다. 이 프로젝트는 정규식으로 curl/wget 출력이 bash·dash·zsh로 넘어가는지 찾으며, 따옴표나 경로 유무에 영향받지 않는다."
    sigma_원본_적용:
      sigma_탐지_건수: 0
      차이가_난_이유: "첫째 룰은 명령이 따옴표로 끝나서 '| bash로 끝남' 조건에 맞지 않는다. 둘째 룰은 명령에 '/curl'(경로 포함)이 없고 'curl'만 있다."

  - id: R03
    이름: "서버에서 외부로 연결"
    조건: "서버 프로세스의 외부 IP 연결"
    attck: [T1071]
    심각도: medium
    로그: [sysmon]
    탐지_건수: 4
    대응_수준: 대응_룰_없음
    sigma_룰: []
    차이: "Sigma에는 외부로 나가는 연결 전체를 잡는 일반 룰이 없다. 정상 연결이 너무 많아 단독 룰로 쓰지 않기 때문이다. 이 프로젝트는 단독 판정이 아니라 점수 합산의 재료로 쓴다."

  - id: R04
    이름: "비표준 포트로 외부 연결"
    조건: "외부 연결 중 포트가 80·443이 아님"
    attck: [T1571]
    심각도: high
    로그: [sysmon]
    탐지_건수: 1
    대응_수준: 변형
    sigma_룰:
      - 제목: "Potentially Suspicious Malware Callback Communication - Linux"
        id_앞자리: "dbfc7c98"
        경로: "rules/linux/network_connection/net_connection_lnx_susp_malware_callback_port.yml"
    차이: "Sigma는 악성코드가 자주 쓰는 포트 10개 목록(4444 포함)과 사설 IP 제외 조건을 쓴다. 이 프로젝트는 외부로 가는 80·443 외 모든 포트를 잡는다. Sigma 룰은 Initiated 필드를 쓰는데 이 데이터에는 그 필드가 없다."
    sigma_원본_적용:
      sigma_탐지_건수: 1
      차이가_난_이유: "같다 (S137의 4444번 포트)."

  - id: R05
    이름: "내부 SSH 스캔"
    조건: "sshd 외 프로세스가 5분 안에 내부 서버 3대 이상 22번 연결"
    attck: [T1021.004, T1046]
    심각도: high
    로그: [sysmon]
    탐지_건수: 1
    대응_수준: 개념만_같음
    sigma_룰:
      - 제목: "Linux Network Service Scanning - Auditd"
        id_앞자리: "3761e026"
        경로: "rules/linux/auditd/syscall/lnx_auditd_network_service_scanning.yml"
    차이: "Sigma는 auditd 로그에서 스캔 도구 이름(nmap, nc, telnet)으로 탐지한다. 이 프로젝트는 Sysmon 연결 기록에서 5분 안에 서로 다른 내부 서버 3대 이상의 22번 포트로 연결했는지 센다."
    sigma_원본_적용:
      sigma_탐지_건수: 0
      차이가_난_이유: "스캔에 nmap이나 nc가 아니라 bash를 썼다."

  - id: R06
    이름: "임시 폴더의 숨김 파일 생성"
    조건: "/tmp·/var/tmp·/dev/shm 아래 .으로 시작하는 파일"
    attck: [T1564.001]
    심각도: medium
    로그: [sysmon]
    탐지_건수: 1
    대응_수준: 개념만_같음
    sigma_룰:
      - 제목: "Hidden Files and Directories"
        id_앞자리: "d08722cd"
        경로: "rules/linux/auditd/execve/lnx_auditd_hidden_files_directories.yml"
    차이: "Sigma는 auditd 로그에서 mkdir·touch·vi 같은 명령의 인자가 .으로 시작하는지 보며, 위치는 가리지 않는다. 이 프로젝트는 Sysmon 파일 생성 이벤트의 경로가 /tmp·/var/tmp·/dev/shm 아래의 숨김 파일인지 본다."
    sigma_원본_적용:
      sigma_탐지_건수: 0
      차이가_난_이유: "숨김 파일을 touch가 아니라 curl -o로 만들었다."

  - id: R07
    이름: "압축 파일 생성"
    조건: "tar/zip/gzip 결과를 임시 폴더에 저장"
    attck: [T1560.001]
    심각도: medium
    로그: [sysmon]
    탐지_건수: 1
    대응_수준: 변형
    sigma_룰:
      - 제목: "Data Compressed"
        id_앞자리: "a3b5e3e9"
        경로: "rules/linux/auditd/execve/lnx_auditd_data_compressed.yml"
    차이: "Sigma는 auditd 로그를 쓰고 tar -c, zip, gzip -k를 위치와 상관없이 탐지한다(Sigma 등급 low). 이 프로젝트는 Sysmon 로그를 쓰고 임시 폴더에 저장할 때만 탐지한다."
    sigma_원본_적용:
      sigma_탐지_건수: 1
      차이가_난_이유: "같다 (S122의 tar). 정상 데이터에 걸린 것은 없다."

  - id: R08
    이름: "외부로 파일 업로드"
    조건: "curl/wget이 파일 내용을 전송"
    attck: [T1567, T1048]
    심각도: high
    로그: [sysmon]
    탐지_건수: 1
    대응_수준: 거의_같음
    sigma_룰:
      - 제목: "Suspicious Curl File Upload - Linux"
        id_앞자리: "00b90cc1"
        경로: "rules/linux/process_creation/proc_creation_lnx_susp_curl_fileupload.yml"
    차이: "둘 다 curl의 업로드 옵션(--data-*, --upload-file, -T, -F)을 본다. Sigma는 --data(파일이 아닌 값)까지 넓게 잡고 localhost는 제외한다. 이 프로젝트는 @(파일 전송)를 요구하고, wget --post-file도 추가로 잡는다."
    sigma_원본_적용:
      sigma_탐지_건수: 1
      차이가_난_이유: "같다 (S122의 업로드). 정상 curl(healthcheck)에는 걸리지 않았다."

  - id: R09
    이름: "SSH 무차별 대입"
    조건: "같은 IP 1시간 안 로그인 실패 5회 이상"
    attck: [T1110]
    심각도: low
    로그: [sshd]
    탐지_건수: 0
    대응_수준: 대응_룰_없음
    sigma_룰: []
    차이: "Sigma 저장소에 sshd 실패 횟수를 세는 룰이 없다. Sigma 기본 룰은 이벤트 한 줄 단위로 판단하므로 횟수를 세려면 correlation 기능이 필요한데, 대조한 커밋의 rules 폴더에는 correlation 룰이 없다."

  - id: R10
    이름: "실패 뒤 로그인 성공"
    조건: "같은 IP·계정 실패 후 10분 안 로그인 성공"
    attck: [T1110, T1078]
    심각도: medium
    로그: [sshd]
    탐지_건수: 1
    대응_수준: 대응_룰_없음
    sigma_룰: []
    차이: "R09와 같은 이유다. '실패 후 10분 안 성공'은 이 프로젝트가 정한 조건이다."

  - id: R11
    이름: "외부 IP에서 로그인 성공"
    조건: "ssh·콘솔 로그인 성공 IP가 외부"
    attck: [T1078, T1133]
    심각도: medium
    로그: [sshd, teiren_audit]
    탐지_건수: 2
    대응_수준: 대응_룰_없음
    sigma_룰: []
    차이: "외부와 내부를 나누려면 조직의 IP 대역 정보가 있어야 해서 일반 룰로 만들 수 없다. 이 프로젝트는 보강 단계에서 만든 client_zone을 쓴다."

  - id: R12
    이름: "탐지 룰 삭제·비활성화"
    조건: "감사로그 detection_config 행위"
    attck: [T1562.001]
    심각도: high
    로그: [teiren_audit]
    탐지_건수: 2
    대응_수준: 개념만_같음
    sigma_룰:
      - 제목: "AWS GuardDuty Detector Deleted Or Updated"
        id_앞자리: "d2656e78"
        경로: "rules/cloud/aws/cloudtrail/aws_cloudtrail_guardduty_detector_deleted_or_updated.yml"
    차이: "보안 탐지 기능을 삭제하거나 끄는 행위라는 점이 같다. Sigma는 AWS 이벤트 이름(DeleteDetector)을 보고, 이 프로젝트는 테이렌 행위 분류(detection_config)를 본다."

  - id: R13
    이름: "계정·권한 조작"
    조건: "감사로그 iam_change 행위"
    attck: [T1098, T1531]
    심각도: high
    로그: [teiren_audit]
    탐지_건수: 2
    대응_수준: 개념만_같음
    sigma_룰:
      - 제목: "Account Created And Deleted Within A Close Time Frame"
        id_앞자리: "6f583da0"
        경로: "rules/cloud/azure/audit_logs/azure_ad_account_created_deleted.yml"
    차이: "Sigma(Azure)는 계정 추가·삭제를 본다. 이 규칙에 들어 있는 정책 해제(IAM_POLICY_DETACH)에 대응하는 Sigma 룰은 찾지 못했다."

  - id: R14
    이름: "내부 관리 기능 실행"
    조건: "감사로그 admin_exec 행위"
    attck: [T1059]
    심각도: high
    로그: [teiren_audit]
    탐지_건수: 1
    대응_수준: 대응_룰_없음
    sigma_룰: []
    차이: "테이렌 콘솔의 내부 디버그 API(DEBUG_EXEC)는 제품 전용 기능이라 공개 룰이 없다."

  - id: R15
    이름: "웹 경로 반복 오류"
    조건: "같은 IP·경로 5분 안 오류 응답 5회 이상"
    attck: [T1190, T1595]
    심각도: medium
    로그: [nginx]
    탐지_건수: 1
    대응_수준: 대응_룰_없음
    sigma_룰: []
    차이: "Sigma 웹 룰은 요청 내용(경로 조작, SQL 주입 문자열 등)을 본다. 오류 횟수를 세는 룰은 없다."

  - id: R16
    이름: "MFA 없는 최상위 계정 로그인"
    조건: "감사로그 root 로그인 MFA 없음"
    attck: [T1078.004]
    심각도: low
    로그: [teiren_audit]
    탐지_건수: 23
    대응_수준: 개념만_같음
    sigma_룰:
      - 제목: "AWS Successful Console Login Without MFA"
        id_앞자리: "77caf516"
        경로: "rules/cloud/aws/cloudtrail/aws_cloudtrail_console_login_success_without_mfa.yml"
      - 제목: "AWS Root Credentials"
        id_앞자리: "8ad1600d"
        경로: "rules/cloud/aws/cloudtrail/aws_root_account_usage.yml"
    차이: "Sigma에는 'MFA 없는 로그인'과 'root 계정 사용'이 따로 있다. 이 프로젝트는 둘이 겹친 경우 하나만 본다. 테이렌이 ROOT_LOGIN_NO_MFA라는 이벤트를 따로 남기기 때문이다."

sigma_원본_적용_결과:
  방법: "Sigma 룰 조건을 Python으로 그대로 옮겨 data/07_sessions/timeline_sessions.csv에 적용했다. auditd용 룰(R05~R07 대응)은 같은 뜻의 Sysmon 필드(CommandLine, Image)로 바꿔 적용했다."
  적용_기록이_있는_규칙: [R01, R02, R04, R05, R06, R07, R08]
