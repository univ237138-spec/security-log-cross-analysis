  original_xml: |
    <!--
      -  Systemd rules
      -  Author: Dan Parriott <ddpbsd@gmail.com>.
      -  Author: atomicturtle.
      -  Updated by Wazuh, Inc.
      -  Copyright (C) 2015, Wazuh Inc.
