  original_xml: "<!--\n  -  Docker rules\n  -  Created by Wazuh, Inc.\n  -  Copyright (C) 2015, Wazuh Inc.\n  -\
    \  This program is a free software; you can redistribute it and/or modify it under the terms of GPLv2.\n-->\n\
    \n<!-- ID: 86000 - 86249 -->\n\n<group name=\"docker,\">\n\n\t<rule id=\"86000\" level=\"0\">\n        <decoded_as>docker</decoded_as>\n\
    \        <description>Docker messages</description>\n    </rule>\n\n    <!--\n    time=\"2017-02-18T08:48:04.269962983Z\"\
    \ level=info msg=\"Text\"\n    Oct 25 12:19:15 localhost dockerd[1759]: time=\"2017-02-18T08:48:04.269962983Z\"\
    \ level=info msg=\"Text\"\n    -->\n    <rule id=\"86001\" level=\"1\">\n        <if_sid>86000</if_sid>\n  \
    \      <field name=\"docker.level\">info</field>\n        <description>Docker: Information message</description>\n\
    \        <group>docker-info,</group>\n    </rule>\n\n    <!--\n    time=\"2017-02-18T08:48:04.269962983Z\" level=warning\
    \ msg=\"Text\"\n    Feb 28 12:45:09 localhost dockerd[2155]: time=\"2017-02-18T08:48:04.269962983Z\" level=warning\
    \ msg=\"Text\"\n    -->\n    <rule id=\"86002\" level=\"1\">\n        <if_sid>86000</if_sid>\n        <field\
    \ name=\"docker.level\">warning</field>\n        <description>Docker: Warning message</description>\n      \
    \  <group>docker-warning,</group>\n    </rule>\n\n    <!--\n    time=\"2017-02-18T08:48:04.269962983Z\" level=error\
    \ msg=\"Text\"\n    Dec 18 20:02:35 localhost containerd[4095]: time=\"2017-02-18T08:48:04.269962983Z\" level=error\
    \ msg=\"Text\"\n    -->\n    <rule id=\"86003\" level=\"3\">\n        <if_sid>86000</if_sid>\n        <field\
    \ name=\"docker.level\">error</field>\n        <description>Docker: Error message</description>\n        <group>docker-error,</group>\n\
    \    </rule>\n\n    <!--\n    time=\"2017-02-18T08:48:04.269962983Z\" level=fatal msg=\"Text\"\n    Mar 08 20:02:35\
    \ localhost containerd[1234]: time=\"2017-02-18T08:48:04.269962983Z\" level=fatal msg=\"Text\"\n    -->\n  \
    \  <rule id=\"86004\" level=\"3\">\n        <if_sid>86000</if_sid>\n        <field name=\"docker.level\">fatal</field>\n\
    \        <description>Docker: Fatal message</description>\n        <group>docker-fatal,</group>\n    </rule>\n\
    \n    <!--\n    time=\"2017-02-18T17:03:17.550149226Z\" level=error msg=\"Upload failed: unauthorized: authentication\
    \ required\"\n    time=\"2017-02-18T17:03:17.550486075Z\" level=error msg=\"Attempting next endpoint for push\
    \ after error: unauthorized: authentication required\"\n    May 01 14:47:42 localhost dockerd: time=\"2017-02-18T17:03:17.550149226Z\"\
    \ level=error msg=\"Upload failed: unauthorized: authentication required\"\n    May 01 14:47:42 localhost containerd:\
    \ time=\"2017-02-18T17:03:17.550486075Z\" level=error msg=\"Attempting next endpoint for push after error: unauthorized:\
    \ authentication required\"\n    -->\n    <rule id=\"86005\" level=\"4\">\n        <if_sid>86003</if_sid>\n\
    \        <match>unauthorized</match>\n        <description>Docker: Error - unauthorized action</description>\n\
    \        <group>docker-error,pci_dss_10.2.4,pci_dss_10.2.5,gdpr_IV_35.7.d,</group>\n    </rule>\n\n    <!--\n\
    \    time=\"2017-02-18T17:16:50.976006728Z\" level=error msg=\"Upload failed: denied: User: abc:def:egh::1234:a/b/i-01234\
    \ is not authorized to perform: ecr:InitiateLayerUpload on resource: abc:def:ecr:eu-central-1:1234:repository/directory\"\
    \n\n    time=\"2017-02-18T17:16:50.986987199Z\" level=error msg=\"Attempting next endpoint for push after error:\
    \ denied: User: abc:def:egh::1234:a/b/i-01234 is not authorized to perform: ecr:InitiateLayerUpload on resource:\
    \ abc:def:ecr:eu-central-1:1234:repository/directory\"\n\n    Apr 14 14:47:42 localhost containerd: time=\"\
    2017-02-18T17:16:50.976006728Z\" level=error msg=\"Upload failed: denied: User: abc:def:egh::1234:a/b/i-01234\
    \ is not authorized to perform: ecr:InitiateLayerUpload on resource: abc:def:ecr:eu-central-1:1234:repository/directory\"\
    \n\n    Apr 14 15:12:17 localhost dockerd: time=\"2017-02-18T17:16:50.986987199Z\" level=error msg=\"Attempting\
    \ next endpoint for push after error: denied: User: abc:def:egh::1234:a/b/i-01234 is not authorized to perform:\
    \ ecr:InitiateLayerUpload on resource: abc:def:ecr:eu-central-1:1234:repository/directory\"\n    -->\n    <rule\
    \ id=\"86006\" level=\"4\">\n        <if_sid>86003</if_sid>\n        <match>denied: User</match>\n        <description>Docker:\
    \ Error - denied action</description>\n        <group>docker-error,pci_dss_10.2.5,gdpr_IV_35.7.d,gdpr_IV_32.2,</group>\n\
    \    </rule>\n\n</group>\n"
