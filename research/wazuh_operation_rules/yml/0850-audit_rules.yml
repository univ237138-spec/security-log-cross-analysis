  original_xml: "<!--\n  Copyright (C) 2015, Wazuh Inc.\n-->\n\n<!-- \n  General Linux Audit module channel detection\
    \ rules:           92600 - 92649\n-->\n\n<group name=\"audit_detections,\">\n\n  <rule id=\"92600\" level=\"\
    0\">\n    <if_group>audit</if_group>\n    <field name=\"audit.exe\" type=\"pcre2\">python</field>\n    <description>Executed\
    \ python script.</description>\n    <mitre>\n      <id>T1059.006</id>\n    </mitre>\n  </rule>\n\n  <rule id=\"\
    92601\" level=\"6\">\n    <if_sid>92600</if_sid>\n    <match type=\"pcre2\">a\\d=\"\\w+\\.py\".+cwd=\"/tmp\"\
    |a\\d=\"/tmp/.+\\.py</match>\n    <description>Executed python script from /tmp/ folder.</description>\n   \
    \ <mitre>\n      <id>T1059.006</id>\n    </mitre>\n  </rule>\n\n  <rule id=\"92602\" level=\"12\">\n    <if_sid>92600,\
    \ 92601</if_sid>\n    <match type=\"pcre2\">(psexec.py|smbexec.py).+a\\d=\"-hashes\".+a\\d=\".+:.+</match>\n\
    \    <description>Suspicious python script matches Impacket signature, possible use of stolen credentials or\
    \ pass the hash attack.</description>\n    <mitre>\n      <id>T1059.006</id>\n      <id>T1550.002</id>\n   \
    \ </mitre>\n  </rule>\n\n  <rule id=\"92603\" level=\"6\">\n    <if_group>audit</if_group>\n    <field name=\"\
    audit.command\" type=\"pcre2\">^scp$</field>\n    <field name=\"audit.file.name\" type=\"pcre2\">.+</field>\n\
    \    <description>A file was copied to this system over SSH using SCP.</description>\n    <mitre>\n      <id>T1021.004</id>\n\
    \    </mitre>\n  </rule>\n\n  <rule id=\"92604\" level=\"6\">\n    <if_group>audit</if_group>\n    <field name=\"\
    audit.execve.a0\" type=\"pcre2\">ps</field>\n    <field name=\"audit.execve.a1\" type=\"pcre2\">^(?=.*a)(?=.*x)</field>\n\
    \    <description>Processes running for all users were queried with ps command.</description>\n    <mitre>\n\
    \      <id>T1057</id>\n    </mitre>\n  </rule>\n\n  <rule id=\"92605\" level=\"6\">\n    <if_group>audit</if_group>\n\
    \    <field name=\"audit.execve.a0\" type=\"pcre2\">ls</field>\n    <field name=\"audit.execve.a2\" type=\"\
    pcre2\">^(?=.*a)(?=.*R)</field>\n    <description>Executed recursive query of all files using ls command.</description>\n\
    \    <mitre>\n      <id>T1083</id>\n    </mitre>\n  </rule>\n\n  <rule id=\"92606\" level=\"6\">\n    <if_group>audit</if_group>\n\
    \    <field name=\"audit.command\" type=\"pcre2\">lscpu</field>\n    <field name=\"audit.file.name\" type=\"\
    pcre2\">.+</field>\n    <description>A file was copied to this system over SSH using LSCPU.</description>\n\
    \    <mitre>\n      <id>T1021.004</id>\n    </mitre>\n  </rule>\n\n</group>\n"
