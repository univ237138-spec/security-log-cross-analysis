  original_xml: "<!--\n  Copyright (C) 2015, Wazuh Inc.\n-->\n\n<!-- \n  Palo Alto v8.X - v10.X rules\n    Palo\
    \ Alto rules ID:           64500 - 64508\n-->\n\n<group name=\"paloalto,\">\n\n  <!-- Generic rule -->\n  <rule\
    \ id=\"64500\" level=\"0\">\n    <decoded_as>paloalto</decoded_as>\n    <description>Palo Alto $(type) event.</description>\n\
    \  </rule>\n\n  <!-- Generic by severity(informational, low, medium, high, critical) rules, THREAT and SYSTEM\
    \ only so far -->\n  <rule id=\"64501\" level=\"2\">\n    <if_sid>64500</if_sid>\n    <field name=\"severity\"\
    \ type=\"pcre2\">(?i)^(?:informational|low)$</field>\n    <description>Palo Alto $(type): $(severity) event.</description>\n\
    \  </rule>\n\n  <rule id=\"64502\" level=\"3\">\n    <if_sid>64500</if_sid>\n    <field name=\"severity\" type=\"\
    pcre2\">(?i)^medium$</field>\n    <description>Palo Alto $(type): $(severity) event.</description>\n  </rule>\n\
    \n  <rule id=\"64503\" level=\"5\">\n    <if_sid>64500</if_sid>\n    <field name=\"severity\" type=\"pcre2\"\
    >(?i)^high$</field>\n    <description>Palo Alto $(type): $(severity) event.</description>\n  </rule>\n\n  <rule\
    \ id=\"64504\" level=\"11\">\n    <if_sid>64500</if_sid>\n    <field name=\"severity\" type=\"pcre2\">(?i)^critical$</field>\n\
    \    <description>Palo Alto $(type): $(severity) event.</description>\n  </rule>\n\n  <!-- Specific rules -->\n\
    \  <!-- Traffic -->\n  <rule id=\"64505\" level=\"0\">\n    <if_sid>64500</if_sid>\n    <field name=\"type\"\
    >^Traffic$</field>\n    <field name=\"content_type\" type=\"pcre2\">(?i)^.+$</field>\n    <description>Palo\
    \ Alto Traffic: $(content_type) event.</description>\n  </rule>\n\n  <rule id=\"64506\" level=\"2\">\n    <if_sid>64505</if_sid>\n\
    \    <field name=\"content_type\">start</field>\n    <description>Palo Alto Traffic: Session started log on\
    \ $(device_name).</description>\n    <group>gdpr_IV_35.7.d,gpg13_4.12,hipaa_164.312.b,pci_dss_1.4,pci_dss_10.6.1,pci_dss_11.4,tsc_CC6.1,tsc_CC6.7,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,tsc_CC7.4,</group>\n\
    \  </rule>\n\n  <rule id=\"64507\" level=\"2\">\n    <if_sid>64505</if_sid>\n    <field name=\"content_type\"\
    >end</field>\n    <description>Palo Alto Traffic: Session ended on $(device_name) from $(source_address) to\
    \ $(destination_address). Reason: $(session_end_reason).</description>\n    <group>gdpr_IV_35.7.d,gpg13_4.12,hipaa_164.312.b,pci_dss_1.4,pci_dss_10.6.1,pci_dss_11.4,tsc_CC6.1,tsc_CC6.7,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,tsc_CC7.4,</group>\n\
    \  </rule>\n\n  <rule id=\"64508\" level=\"6\">\n    <if_sid>64505</if_sid>\n    <field name=\"content_type\"\
    \ type=\"pcre2\">^(?:drop|deny)$</field>\n    <description>Palo Alto Traffic: Session dropped  on $(device_name)\
    \ from $(source_address) to $(destination_address). Reason: $(session_end_reason). Action: $(action).</description>\n\
    \    <mitre>\n      <id>T1072</id>\n      <id>T1190</id>\n    </mitre>\n    <group>gdpr_IV_35.7.d,gpg13_4.12,hipaa_164.312.b,pci_dss_1.4,pci_dss_10.6.1,pci_dss_11.4,tsc_CC6.1,tsc_CC6.7,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,tsc_CC7.4,</group>\n\
    \  </rule>\n\n</group>\n"
