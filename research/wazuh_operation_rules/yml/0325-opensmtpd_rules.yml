    <!--
      -  Open smtpd rules
      -  Author: Daniel Cid.
      -  Updated by Wazuh, Inc.
      -  Copyright (C) 2015, Wazuh Inc.
      -  Copyright (C) 2009 Trend Micro Inc.
      -  This program is a free software; you can redistribute it and/or modify it under the terms of GPLv2.
