    \ - application channel ID: 60600 - 61099\n-->\n\n<var name=\"MS_FREQ\">8</var>\n\n<group name=\"windows,windows_application,\"\
    >\n\n  <rule id=\"60600\" level=\"0\">\n    <if_sid>60003</if_sid>\n    <field name=\"win.system.severityValue\"\
    >^INFORMATION$</field>\n    <options>no_full_log</options>\n    <description>Windows application informational\
    \ event.</description>\n  </rule>\n\n  <rule id=\"60601\" level=\"0\">\n    <if_sid>60003</if_sid>\n    <field\
    \ name=\"win.system.severityValue\">^WARNING$</field>\n    <options>no_full_log</options>\n    <description>Windows\
    \ application warning event.</description>\n    <group>gpg13_4.12,</group>\n  </rule>\n\n  <rule id=\"60602\"\
    \ level=\"9\">\n    <if_sid>60003</if_sid>\n    <field name=\"win.system.severityValue\">^ERROR$</field>\n \
    \   <options>no_full_log</options>\n    <description>Windows application error event.</description>\n    <group>gdpr_IV_35.7.d,gpg13_4.3,system_error,</group>\n\
    \  </rule>\n\n  <!--  Chrome remote desktop  -->\n  <rule id=\"60603\" level=\"5\">\n    <if_sid>60602</if_sid>\n\
    \    <field name=\"win.system.providerName\">^chromoting$</field>\n    <field name=\"win.system.message\">\\\
    .*Access denied for client</field>\n    <options>no_full_log</options>\n    <description>Chrome remote desktop\
    \ attempt - access denied $(win.eventdata.data).</description>\n    <group>gdpr_IV_32.2,gdpr_IV_35.7.d,</group>\n\
    \  </rule>\n\n  <rule id=\"60604\" level=\"5\">\n    <if_sid>60600</if_sid>\n    <field name=\"win.system.providerName\"\
    >^chromoting$</field>\n    <field name=\"win.system.eventID\">^1$</field>\n    <options>no_full_log</options>\n\
    \    <description>Chrome remote desktop attempt - Client connected $(win.eventdata.data).</description>\n  \
    \  <group>gdpr_IV_32.2,</group>\n  </rule>\n\n  <rule id=\"60605\" level=\"5\">\n    <if_sid>60600</if_sid>\n\
    \    <field name=\"win.system.providerName\">^chromoting$</field>\n    <field name=\"win.system.eventID\">^2$</field>\n\
    \    <options>no_full_log</options>\n    <description>Chrome remote desktop attempt - disconnected ($(win.eventdata.data)).</description>\n\
    \    <group>gdpr_IV_32.2,</group>\n  </rule>\n\n  <rule id=\"60606\" level=\"5\">\n    <if_sid>60600</if_sid>\n\
    \    <field name=\"win.system.providerName\">^chromoting$</field>\n    <field name=\"win.system.eventID\">^5$</field>\n\
    \    <options>no_full_log</options>\n    <description>Chrome remote desktop attempt - started connection from\
    \ $(win.eventdata.data).</description>\n    <group>gdpr_IV_32.2,</group>\n  </rule>\n\n  <rule id=\"60607\"\
    \ level=\"3\">\n    <if_sid>60600</if_sid>\n    <field name=\"win.system.providerName\">^Microsoft-Windows-Defrag$</field>\n\
    \    <field name=\"win.system.eventID\">^258$</field>\n    <options>no_full_log</options>\n    <description>Disk\
    \ defragmenter successfully completed an analysis.</description>\n  </rule>\n\n  <rule id=\"60608\" level=\"\
    4\">\n    <if_sid>60600</if_sid>\n    <field name=\"win.system.providerName\">^Windows Error Reporting$</field>\n\
    \    <field name=\"win.system.eventID\">^1001$</field>\n    <options>no_full_log</options>\n    <description>Summary\
    \ event of the report's signatures.</description>\n  </rule>\n\n  <rule id=\"60609\" level=\"0\">\n    <if_sid>60600</if_sid>\n\
    \    <field name=\"win.system.providerName\">^MsiInstaller$</field>\n    <options>no_full_log</options>\n  \
    \  <description>Group of MsiInstaller events.</description>\n  </rule>\n\n  <rule id=\"60610\" level=\"3\">\n\
    \    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\">^1040$</field>\n    <options>no_full_log</options>\n\
    \    <description>Windows installer began an installation process.</description>\n  </rule>\n\n  <rule id=\"\
    60611\" level=\"3\">\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\">^11724$|^1034$</field>\n\
    \    <options>no_full_log</options>\n    <description>Application uninstalled $(win.eventdata.data).</description>\n\
    \  </rule>\n\n  <rule id=\"60612\" level=\"3\">\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\"\
    >^11707$|^1033$</field>\n    <options>no_full_log</options>\n    <description>Application installed $(win.eventdata.data).</description>\n\
    \  </rule>\n\n  <rule id=\"60613\" level=\"5\">\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\"\
