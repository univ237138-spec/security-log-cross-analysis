    \ installer proxy information not correctly registered.</description>\n  </rule>\n\n  <rule id=\"60621\" level=\"\
    5\">\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\">^1015$</field>\n    <options>no_full_log</options>\n\
    \    <description>MsiInstaller: Failed to connect to server.</description>\n  </rule>\n\n  <rule id=\"60622\"\
    \ level=\"5\">\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\">^1016$</field>\n    <options>no_full_log</options>\n\
    \    <description>Detection of product feature component failed.</description>\n  </rule>\n\n  <rule id=\"60623\"\
    \ level=\"5\">\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\">^1018$|^1023$</field>\n \
    \   <options>no_full_log</options>\n    <description>Application cannot be installed.</description>\n  </rule>\n\
    \n  <rule id=\"60624\" level=\"3\">\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\">^1019$</field>\n\
    \    <options>no_full_log</options>\n    <description>Update successfully removed.</description>\n  </rule>\n\
    \n  <rule id=\"60625\" level=\"5\">\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\">^1020$|^1021$</field>\n\
    \    <options>no_full_log</options>\n    <description>Update could not be removed.</description>\n  </rule>\n\
    \n  <rule id=\"60626\" level=\"3\">\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\">^1022$</field>\n\
    \    <options>no_full_log</options>\n    <description>Update installed successfully.</description>\n  </rule>\n\
    \n  <rule id=\"60627\" level=\"5\">\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\">^1024$</field>\n\
    \    <options>no_full_log</options>\n    <description>Update could not be installed.</description>\n  </rule>\n\
    \n  <rule id=\"60628\" level=\"5\">\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\">^1025$</field>\n\
    \    <options>no_full_log</options>\n    <description>File in use by another program.</description>\n  </rule>\n\
    \n  <rule id=\"60629\" level=\"7\">\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\">^1026$|^1027$</field>\n\
    \    <options>no_full_log</options>\n    <description>The configuration data registry key, sub key or configuration\
    \ data cache folder were not secured properly.</description>\n  </rule>\n\n  <rule id=\"60630\" level=\"3\"\
    >\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\">^1029$</field>\n    <options>no_full_log</options>\n\
    \    <description>The product installation or update required a restart for all changes to take effect.</description>\n\
    \  </rule>\n\n  <rule id=\"60631\" level=\"5\">\n    <if_sid>60609</if_sid>\n    <field name=\"win.system.eventID\"\
