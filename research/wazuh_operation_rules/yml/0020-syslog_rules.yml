      - element: group
        text: pci_dss_10.6.1,hipaa_164.312.b
    - element: rule
      attributes:
        id: '5102'
        level: '0'
      children:
      - element: if_sid
        text: '5100'
      - element: match
        text: 'modprobe: Can''t locate module sound'
      - element: description
        text: Informative message from the kernel.
      - element: group
        text: pci_dss_10.6.1,hipaa_164.312.b
    - element: rule
      attributes:
        id: '5103'
        level: '9'
      children:
      - element: if_sid
        text: '5100'
      - element: match
        text: Oversized packet received from
      - element: description
