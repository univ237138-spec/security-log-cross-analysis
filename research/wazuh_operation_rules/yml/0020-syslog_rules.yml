schema: wazuh-original-rules-yaml/v1
format_only_conversion: true
native_runtime_format: Wazuh XML
authoritative_field: sources[].original_xml
upstream:
  repository: https://github.com/wazuh/wazuh
  tag: v4.14.8
  commit: f470ad7db717b18db7feeed568949643698f0f34
sources:
- file: ruleset/rules/0020-syslog_rules.xml
  url: https://github.com/wazuh/wazuh/blob/f470ad7db717b18db7feeed568949643698f0f34/ruleset/rules/0020-syslog_rules.xml
  sha256: 31d475e980b17bd375c5bc940582373c5949a50b096500803b9de7ca7723fa11
  rule_count: 117
  elements:
  - element: var
    attributes:
      name: BAD_WORDS
    text: core_dumped|failure|error|attack| bad |illegal |denied|refused|unauthorized|fatal|failed|Segmentation
      Fault|Corrupted
  - element: group
    attributes:
      name: syslog,errors,
    children:
    - element: rule
      attributes:
        id: '1001'
        level: '2'
      children:
      - element: match
        text: ^Couldn't open /etc/securetty
      - element: description
        text: File missing. Root access unrestricted.
      - element: group
        text: pci_dss_10.2.4,gpg13_4.1,gdpr_IV_35.7.d,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.7,tsc_CC6.1,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,
    - element: rule
      attributes:
        id: '1002'
        level: '2'
      children:
      - element: match
        text: $BAD_WORDS
      - element: description
        text: Unknown problem somewhere in the system.
      - element: group
        text: gpg13_4.3,
    - element: rule
      attributes:
        id: '1003'
        level: '13'
        maxsize: '1025'
        noalert: '1'
      children:
      - element: description
        text: Non standard syslog message (size too large).
      - element: mitre
        children:
        - element: id
          text: T1499
      - element: group
        text: gpg13_4.3,
    - element: rule
      attributes:
        id: '1004'
        level: '5'
      children:
      - element: match
        text: ^exiting on signal
      - element: description
        text: Syslogd exiting (logging stopped).
      - element: group
        text: pci_dss_10.6.1,gpg13_10.1,gpg13_4.14,gdpr_IV_35.7.d,hipaa_164.312.b,nist_800_53_AU.6,tsc_CC7.2,tsc_CC7.3,
    - element: rule
      attributes:
        id: '1005'
        level: '5'
      children:
      - element: program_name
        text: syslogd
      - element: match
        text: ^restart
      - element: description
        text: Syslogd restarted.
      - element: group
        text: pci_dss_10.6.1,gpg13_10.1,gpg13_4.14,gdpr_IV_35.7.d,hipaa_164.312.b,nist_800_53_AU.6,tsc_CC7.2,tsc_CC7.3,
    - element: rule
      attributes:
        id: '1006'
        level: '5'
      children:
      - element: regex
        text: ^syslogd \S+ restart
      - element: description
        text: Syslogd restarted.
      - element: group
        text: pci_dss_10.6.1,gpg13_10.1,gpg13_4.14,gdpr_IV_35.7.d,hipaa_164.312.b,nist_800_53_AU.6,tsc_CC7.2,tsc_CC7.3,
    - element: rule
      attributes:
        id: '1007'
        level: '7'
      children:
      - element: match
        text: file system full|No space left on device
      - element: description
        text: File system full.
      - element: group
        text: low_diskspace,pci_dss_10.6.1,gpg13_4.1,gdpr_IV_35.7.d,hipaa_164.312.b,nist_800_53_AU.6,tsc_CC7.2,tsc_CC7.3,
    - element: rule
      attributes:
        id: '1008'
        level: '5'
      children:
      - element: match
        text: killed by SIGTERM
      - element: description
        text: Process exiting (killed).
      - element: group
        text: service_availability,pci_dss_10.6.1,gpg13_4.3,gpg13_4.14,gdpr_IV_35.7.d,hipaa_164.312.b,nist_800_53_AU.6,tsc_CC7.2,tsc_CC7.3,
    - element: rule
      attributes:
        id: '1009'
        level: '0'
      children:
      - element: if_sid
        text: '1002'
      - element: match
        text: 'terminated without error|can''t verify hostname: getaddrinfo|'
      - element: match
        text: PPM exceeds tolerance
      - element: description
        text: Ignoring known false positives on rule 1002.
    - element: rule
      attributes:
        id: '1010'
        level: '5'
      children:
      - element: match
        text: 'segfault at '
      - element: description
        text: Process segfaulted.
      - element: group
        text: service_availability,gdpr_IV_35.7.d,
  - element: group
    attributes:
      name: syslog,nfs,
    children:
    - element: rule
      attributes:
        id: '2100'
        level: '0'
        noalert: '1'
      children:
      - element: program_name
        text: ^automount|^mount
      - element: description
        text: NFS rules grouped.
    - element: rule
      attributes:
        id: '2101'
        level: '4'
      children:
      - element: if_sid
        text: '2100'
      - element: match
        text: 'nfs: mount failure'
      - element: description
        text: Unable to mount the NFS share.
      - element: group
        text: pci_dss_10.6.3
    - element: rule
      attributes:
        id: '2102'
        level: '4'
      children:
      - element: if_sid
        text: '2100'
      - element: match
        text: 'reason given by server: Permission denied'
      - element: description
        text: Unable to mount the NFS directory.
      - element: group
        text: pci_dss_10.6.3
    - element: rule
      attributes:
        id: '2103'
        level: '4'
      children:
      - element: match
        text: '^rpc.mountd: refused mount request from'
      - element: description
        text: Unable to mount the NFS directory.
      - element: group
        text: pci_dss_10.6.3
    - element: rule
      attributes:
        id: '2104'
        level: '2'
      children:
      - element: if_sid
        text: '2100'
      - element: regex
        text: lookup for \S+ failed
      - element: description
        text: Automount informative message.
      - element: group
        text: pci_dss_10.6.1,hipaa_164.312.b
  - element: group
    attributes:
      name: syslog,xinetd,
    children:
    - element: rule
      attributes:
        id: '2301'
        level: '10'
      children:
      - element: match
        text: '^Deactivating service '
      - element: description
        text: 'xinetd: Excessive number connections to a service.'
      - element: mitre
        children:
        - element: id
          text: T1499
      - element: group
        text: pci_dss_10.6.1,gdpr_IV_35.7.d,hipaa_164.312.b,nist_800_53_AU.6,tsc_CC7.2,tsc_CC7.3,
  - element: group
    attributes:
      name: syslog,access_control,
    children:
    - element: rule
      attributes:
        id: '2501'
        level: '5'
      children:
      - element: match
        text: FAILED LOGIN |authentication failure|
      - element: match
        text: Authentication failed for|invalid password for|
      - element: match
        text: 'LOGIN FAILURE|auth failure: |authentication error|'
      - element: match
        text: authinternal failed|Failed to authorize|
      - element: match
        text: 'Wrong password given for|login failed|Auth: Login incorrect|'
      - element: match
        text: Failed to authenticate user
      - element: group
        text: authentication_failed,pci_dss_10.2.4,pci_dss_10.2.5,gpg13_7.8,gdpr_IV_35.7.d,gdpr_IV_32.2,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.7,tsc_CC6.1,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,
      - element: description
        text: 'syslog: User authentication failure.'
    - element: rule
      attributes:
        id: '2502'
        level: '10'
      children:
      - element: match
        text: more authentication failures;|REPEATED login failures
      - element: description
        text: 'syslog: User missed the password more than one time'
      - element: mitre
        children:
        - element: id
          text: T1110
      - element: group
        text: authentication_failed,pci_dss_10.2.4,pci_dss_10.2.5,gpg13_7.8,gdpr_IV_35.7.d,gdpr_IV_32.2,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.7,tsc_CC6.1,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,
    - element: rule
      attributes:
        id: '2503'
        level: '5'
      children:
      - element: regex
        text: ^refused connect from|
      - element: regex
        text: ^libwrap refused connection|
      - element: regex
        text: Connection from \S+ denied
      - element: description
        text: 'syslog: Connection blocked by Tcp Wrappers.'
      - element: mitre
        children:
        - element: id
          text: T1095
      - element: group
        text: access_denied,pci_dss_10.2.4,gdpr_IV_35.7.d,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.7,tsc_CC6.1,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,
    - element: rule
      attributes:
        id: '2504'
        level: '9'
      children:
      - element: match
        text: ILLEGAL ROOT LOGIN|ROOT LOGIN REFUSED
      - element: description
        text: 'syslog: Illegal root login.'
      - element: mitre
        children:
        - element: id
          text: T1548.003
      - element: group
        text: invalid_login,pci_dss_10.2.4,pci_dss_10.2.5,pci_dss_10.2.2,gpg13_7.8,gdpr_IV_35.7.d,gdpr_IV_32.2,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.7,nist_800_53_AC.6,tsc_CC6.1,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,
    - element: rule
      attributes:
        id: '2505'
        level: '3'
      children:
      - element: match
        text: ^ROOT LOGIN  on
      - element: description
        text: 'syslog: Physical root login.'
      - element: group
        text: pci_dss_10.2.2,gpg13_7.8,gdpr_IV_32.2,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.6,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,
    - element: rule
      attributes:
        id: '2506'
        level: '3'
      children:
      - element: match
        text: ^Authentication passed
      - element: description
        text: 'syslog: Pop3 Authentication passed.'
      - element: group
        text: pci_dss_10.2.5,gpg13_7.1,gdpr_IV_35.7.d,gdpr_IV_32.2,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.7,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,
    - element: rule
      attributes:
        id: '2507'
        level: '0'
      children:
      - element: decoded_as
        text: openldap
      - element: description
        text: OpenLDAP group.
    - element: rule
      attributes:
        id: '2508'
        level: '3'
      children:
      - element: if_sid
        text: '2507'
      - element: match
        text: ACCEPT from
      - element: description
        text: OpenLDAP connection open.
      - element: group
        text: pci_dss_10.2.5,gdpr_IV_32.2,
    - element: rule
      attributes:
        id: '2509'
        level: '5'
        timeframe: '10'
        frequency: '2'
      children:
      - element: if_sid
        text: '2507'
      - element: if_matched_sid
        text: '2508'
      - element: same_id
        text: ''
      - element: match
        text: RESULT tag=97 err=49
      - element: description
        text: OpenLDAP authentication failed.
      - element: group
        text: pci_dss_10.2.4,pci_dss_10.2.5,gpg13_7.1,gdpr_IV_35.7.d,gdpr_IV_32.2,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.7,tsc_CC6.1,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,
  - element: group
    attributes:
      name: syslog,access_control,
    children:
    - element: rule
      attributes:
        id: '2550'
        level: '0'
        noalert: '1'
      children:
      - element: decoded_as
        text: rshd
      - element: description
        text: rshd messages grouped.
    - element: rule
      attributes:
        id: '2551'
        level: '10'
      children:
      - element: if_sid
        text: '2550'
      - element: regex
        text: ^Connection from \S+ on illegal port$
      - element: description
        text: Connection to rshd from unprivileged port. Possible network scan.
      - element: mitre
        children:
        - element: id
          text: T1046
      - element: group
        text: connection_attempt,pci_dss_10.6.1,gpg13_7.1,gdpr_IV_35.7.d,hipaa_164.312.b,nist_800_53_AU.6,tsc_CC7.2,tsc_CC7.3,
  - element: group
    attributes:
      name: syslog,mail,
    children:
    - element: rule
      attributes:
        id: '2701'
        level: '0'
      children:
      - element: program_name
        text: ^procmail
      - element: description
        text: Ignoring procmail messages.
  - element: group
