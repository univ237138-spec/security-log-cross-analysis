# R14
title: "Teiren Internal Administrative Execution"
id: "f79223f1-0390-4bd5-b8c2-bc1b4d2dd13d"
status: "experimental"
description: "Detects Teiren audit events classified by the project as internal administrative execution."
author: "TEIREN Security Log Cross Analysis Team"
date: "2026-10-12"
logsource:
    product: "teiren"
    service: "audit"
    definition: "Project-specific Teiren audit log; event_action and action_category are derived by this repository and need a custom mapping."
detection:
    selection:
        action_category: "admin_exec"
    condition: "selection"
fields:
    - "event_action"
    - "action_category"
    - "request"
    - "account"
falsepositives:
    - "Authorized diagnostic or support operations."
level: "high"
