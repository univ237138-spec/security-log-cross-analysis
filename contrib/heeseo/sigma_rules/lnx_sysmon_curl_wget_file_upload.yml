# R08
title: "Curl Or Wget Command Uploads File Content"
id: "f382a27c-0a09-4656-91f9-db68dc004605"
status: "experimental"
description: "Detects curl or wget command-line options that send file content, including curl file-body and wget post-file options."
references:
    - "https://github.com/SigmaHQ/sigma/blob/8a4813404ea3074890e0cda9272d4d1a8b2941d6/rules/linux/process_creation/proc_creation_lnx_susp_curl_fileupload.yml"
author: "TEIREN Security Log Cross Analysis Team"
date: "2026-10-12"
logsource:
    product: "linux"
    category: "process_creation"
    definition: "Sysmon for Linux process creation; Image and CommandLine are required."
detection:
    selection:
        CommandLine|re: "\\b(curl|wget)\\b.*(--data-binary\\s+@|--data\\s+@|-d\\s+@|-T\\s|--upload-file|-F\\s+\\S*=@|--post-file)"
    condition: "selection"
fields:
    - "Image"
    - "CommandLine"
    - "User"
falsepositives:
    - "Approved file transfer or application upload jobs."
level: "high"
