# R09 SSH 무차별 대입
# docs/06_탐지규칙_Sigma_대조.yaml 을 규칙별로 나눈 파일이다. 필드 이름과 추가 필드의 뜻은 그 파일 머리말에 있다.
# 이 파일에는 문서가 2개 있다: 기본 이벤트 룰과 그것을 세는 correlation 룰.

title: R09 기본 이벤트 - SSH 로그인 실패
id: bf4c3933-e0e1-4ff4-8ee0-c5e7e4b33e80
name: r09_base_ssh_login_failure
status: experimental
description: R09가 세는 기본 이벤트다. 없는 계정으로의 시도와 인증 실패를 함께 로그인 실패로 보며, 단독으로는 경보가 아니다.
references:
    - docs/06_탐지_위험점수.md
author: security-log-cross-analysis 프로젝트 팀
date: 2026-10-03
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    product: linux
    service: sshd
detection:
    selection:
        event_action:
            - 'invalid_user'
            - 'auth_failure'
    condition: selection
falsepositives:
    - 비밀번호를 잘못 입력한 정상 사용자
level: informational
project_rule_id: R09
---
title: R09 SSH 무차별 대입
id: 585b5f2f-96d9-44b8-ac46-a86c259c8128
name: r09_ssh_brute_force
status: experimental
description: 같은 접속 IP에서 1시간 안에 로그인 실패가 5회 이상이면 탐지한다.
references:
    - docs/06_탐지_위험점수.md
author: security-log-cross-analysis 프로젝트 팀
date: 2026-10-03
tags:
    - attack.credential-access
    - attack.t1110
correlation:
    type: event_count
    rules:
        - r09_base_ssh_login_failure
    group-by:
        - client_ip # 보강 컬럼
    timespan: 1h
    condition:
        gte: 5
falsepositives:
    - 알려진 사례 없음 (이 데이터에서는 0건. 외부 IP의 시도가 하루 3~4회로 느려 기준에 걸리지 않았다)
level: low
project_rule_id: R09
project_hits: 0
sigma_match_level: 대응 룰 없음
sigma_difference: Sigma 저장소에 sshd 실패 횟수를 세는 룰이 없다. Sigma 기본 룰은 이벤트 한 줄 단위로 판단하므로 횟수를 세려면 correlation 기능이 필요한데, 대조한 커밋의 rules 폴더에는 correlation 룰이 없다.
