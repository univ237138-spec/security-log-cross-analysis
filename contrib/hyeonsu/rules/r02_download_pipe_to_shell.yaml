sigma_difference: Sigma의 첫째 룰은 'bash -c'로 시작하고 '| bash'로 끝나는 문자열을 찾는다. 둘째 룰은 '/curl'(경로 포함), '/tmp/', 'sh -c'가 모두 있어야 한다. 이 프로젝트는 정규식을 써서 따옴표나 경로 유무에 영향받지 않는다.
sigma_original_hits: 0
sigma_original_note: 첫째 룰은 명령이 따옴표로 끝나서 '| bash로 끝남' 조건에 맞지 않는다. 둘째 룰은 명령에 '/curl'(경로 포함)이 없고 'curl'만 있다.
