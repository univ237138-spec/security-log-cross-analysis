# R08 외부로 파일 업로드
# docs/06_탐지규칙_Sigma_대조.yaml 을 규칙별로 나눈 파일이다. 필드 이름과 추가 필드의 뜻은 그 파일 머리말에 있다.

title: R08 외부로 파일 업로드
id: 916f67cf-564c-4fff-9132-9bc85d137c45
name: r08_file_upload_via_curl_wget
related:
    - id: 00b90cc1-17ec-402c-96ad-3a8117d7a582 # Suspicious Curl File Upload - Linux (Sigma 등급 medium)
      type: similar
status: experimental
description: curl이나 wget이 파일 내용을 웹 요청에 실어 보내는 옵션을 쓰면 탐지한다.
references:
    - docs/06_탐지_위험점수.md
    - https://github.com/SigmaHQ/sigma/blob/8a4813404ea3074890e0cda9272d4d1a8b2941d6/rules/linux/process_creation/proc_creation_lnx_susp_curl_fileupload.yml
author: security-log-cross-analysis 프로젝트 팀
date: 2026-10-03
tags:
    - attack.exfiltration
    - attack.t1567
    - attack.t1048
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|re: '\b(curl|wget)\b.*(--data-binary\s+@|--data\s+@|-d\s+@|-T\s|--upload-file|-F\s+\S*=@|--post-file)'
    condition: selection
falsepositives:
    - 개발자나 관리자가 만든 스크립트의 정상 업로드 (이 데이터의 정상 세션에서는 0건)
level: high
project_rule_id: R08
project_hits: 1
sigma_match_level: 거의 같음
sigma_difference: 둘 다 curl의 업로드 옵션(--data-*, --upload-file, -T, -F)을 본다. Sigma는 --data(파일이 아닌 값)까지 넓게 잡고 localhost는 제외한다. 이 프로젝트는 @(파일 전송)를 요구하고, wget --post-file도 추가로 잡는다.
sigma_original_hits: 1
sigma_original_note: 같다 (S122의 업로드). 정상 curl(healthcheck)에는 걸리지 않았다.
