    \  </rule>\n\n  <rule id=\"80457\" level=\"3\">\n    <if_sid>80451</if_sid>\n    <field name=\"aws.configurationItemStatus\"\
    >ResourceDeletedNotRecorded</field>\n    <options>no_full_log</options>\n    <description>The resource was deleted\
    \ but its configuration was not recorded since the recorder excludes the recording of resources of this type.\
    \ AWS config - history:  [$(aws.awsAccountId) $(aws.awsRegion)] [$(aws.resourceType)]: $(aws.resourceId) ($(aws.configurationItemStatus)).</description>\n\
    \    <group>aws_config,aws_config_history,</group>\n  </rule>\n\n  <!-- Config Snapshot -->\n  <rule id=\"80475\"\
    \ level=\"3\">\n    <if_sid>80452</if_sid>\n    <options>no_full_log</options>\n    <description>AWS config\
    \ - snapshot [$(aws.awsAccountId) $(aws.awsRegion)] [$(aws.resourceType)]: $(aws.resourceId) ($(aws.configurationItemStatus)).</description>\n\
    \    <group>aws_config,aws_config_snapshot,</group>\n  </rule>\n\n  <rule id=\"80476\" level=\"6\">\n    <if_sid>80475</if_sid>\n\
    \    <field name=\"aws.configuration.complianceType\">\\.+</field>\n    <options>no_full_log</options>\n   \
    \ <description>AWS config - snapshot compliance [$(aws.awsAccountId) $(aws.awsRegion)] [$(aws.resourceType)]\
    \ [$(aws.configuration.configRuleList.configRuleName)]: $(aws.resourceId) ($(aws.configurationItemStatus)) $(aws.configuration.complianceType).</description>\n\
    \    <group>aws_config,aws_config_snapshot,aws_config_snapshot_compliance,</group>\n  </rule>\n\n  <!-- AWS\
    \ Trusted Advisor -->\n  <!-- Documentation: https://docs.aws.amazon.com/awssupport/latest/user/trustedadvisor.html\
    \ -->\n  <rule id=\"80480\" level=\"0\">\n    <if_sid>80200</if_sid>\n    <field name=\"aws.source\">trustedadvisor</field>\n\
    \    <options>no_full_log</options>\n    <description>AWS trusted advisor alert.</description>\n    <group>aws_trusted_advisor,</group>\n\
    \  </rule>\n\n  <rule id=\"80481\" level=\"5\">\n    <if_sid>80480</if_sid>\n    <field name=\"aws.status\"\
    >ERROR</field>\n    <options>no_full_log</options>\n    <description>AWS trusted advisor - [$(aws.uuid)] [$(aws.check-name)]:\
    \ $(aws.status).</description>\n    <group>aws_trusted_advisor,</group>\n  </rule>\n\n  <rule id=\"80482\" level=\"\
    4\">\n    <if_sid>80480</if_sid>\n    <field name=\"aws.status\">WARN</field>\n    <options>no_full_log</options>\n\
    \    <description>AWS trusted advisor - [$(aws.uuid)] [$(aws.check-name)]: $(aws.status).</description>\n  \
    \  <group>aws_trusted_advisor,</group>\n  </rule>\n\n  <rule id=\"80483\" level=\"3\">\n    <if_sid>80480</if_sid>\n\
    \    <field name=\"aws.status\">OK</field>\n    <options>no_full_log</options>\n    <description>AWS trusted\
    \ advisor - [$(aws.uuid)] [$(aws.check-name)]: $(aws.status).</description>\n    <group>aws_trusted_advisor,</group>\n\
    \  </rule>\n\n  <!-- AWS KMS (Key Management Service) -->\n  <!-- Documentation: https://docs.aws.amazon.com/kms/latest/developerguide/overview.html\
    \ -->\n  <rule id=\"80490\" level=\"0\">\n    <if_sid>80200</if_sid>\n    <field name=\"aws.source\">kms</field>\n\
    \    <options>no_full_log</options>\n    <description>AWS KMS alert.</description>\n    <group>aws_kms,</group>\n\
    \  </rule>\n\n  <rule id=\"80491\" level=\"3\">\n    <if_sid>80490</if_sid>\n    <options>no_full_log</options>\n\
    \    <description>AWS KMS: [$(aws.eventName)] $(aws.userIdentity.type).</description>\n    <group>aws_kms,</group>\n\
    \  </rule>\n\n  <rule id=\"80492\" level=\"3\">\n    <if_sid>80491</if_sid>\n    <field name=\"aws.userIdentity.userName\"\
    >\\.+</field>\n    <options>no_full_log</options>\n    <description>AWS KMS: [$(aws.eventName)] $(aws.userIdentity.type)\
    \ - $(aws.userIdentity.userName) - $(aws.sourceIPAddress).</description>\n    <group>aws_kms,</group>\n  </rule>\n\
    \n  <rule id=\"80493\" level=\"0\">\n    <if_sid>80491</if_sid>\n    <field name=\"aws.userIdentity.invokedBy\"\
    >AWS Internal</field>\n    <options>no_full_log</options>\n    <description>AWS KMS: [$(aws.eventName)] $(aws.userIdentity.type).</description>\n\
    \    <group>aws_kms,</group>\n  </rule>\n\n  <rule id=\"80494\" level=\"0\">\n    <if_sid>80492</if_sid>\n \
    \   <field name=\"aws.userIdentity.invokedBy\">AWS Internal</field>\n    <options>no_full_log</options>\n  \
    \  <description>AWS KMS: [$(aws.eventName)] $(aws.userIdentity.type) - $(aws.userIdentity.userName) - $(aws.sourceIPAddress).</description>\n\
    \    <group>aws_kms,</group>\n  </rule>\n\n  <!-- AWS Inspector -->\n  <!-- Documentation: https://docs.aws.amazon.com/inspector/latest/userguide/inspector_introduction.html\
    \ -->\n\n  <rule id=\"80495\" level=\"0\">\n    <if_sid>80200</if_sid>\n    <field name=\"aws.source\">inspector</field>\n\
