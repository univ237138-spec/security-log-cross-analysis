    \  </rule>\n\n  <rule id=\"80252\" level=\"10\" frequency=\"22\" timeframe=\"600\">\n    <if_matched_sid>80251</if_matched_sid>\n\
    \    <options>no_full_log</options>\n    <description>AWS Cloudtrail: $(aws.eventSource) - $(aws.eventName)\
