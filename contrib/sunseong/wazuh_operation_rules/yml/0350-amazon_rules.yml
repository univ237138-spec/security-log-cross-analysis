    3\">\n    <if_sid>80301</if_sid>\n    <field name=\"aws.service.action.actionType\">PORT_PROBE</field>\n   \
    \ <options>no_full_log</options>\n    <description>AWS GuardDuty: $(aws.service.action.actionType) - $(aws.title)\
