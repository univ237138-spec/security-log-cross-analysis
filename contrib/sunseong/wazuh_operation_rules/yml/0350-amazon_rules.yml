    \  </rule>\n\n  <!-- Config history -->\n  <rule id=\"80453\" level=\"0\">\n    <if_sid>80451</if_sid>\n   \
    \ <field name=\"aws.configurationItemStatus\">OK</field>\n    <options>no_full_log</options>\n    <description>AWS\
