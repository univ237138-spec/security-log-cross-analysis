    \    <description>AWS config alert.</description>\n    <group>aws_config,</group>\n  </rule>\n\n  <!-- ConfigHistory\
    \ vs ConfigSnapshot -->\n  <rule id=\"80451\" level=\"0\">\n    <if_sid>80450</if_sid>\n    <field name=\"aws.log_info.log_file\"\
