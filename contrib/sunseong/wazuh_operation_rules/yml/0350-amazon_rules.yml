    \    <options>no_full_log</options>\n    <description>AWS GuardDuty: $(aws.service.action.actionType) - $(aws.title).</description>\n\
    \    <group>aws_guardduty,</group>\n  </rule>\n\n  <rule id=\"80302\" level=\"6\">\n    <if_sid>80300</if_sid>\n\
