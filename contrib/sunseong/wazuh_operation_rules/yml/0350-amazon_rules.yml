    \  </rule>\n\n  <rule id=\"80455\" level=\"3\">\n    <if_sid>80451</if_sid>\n    <field name=\"aws.configurationItemStatus\"\
    >ResourceNotRecorded</field>\n    <options>no_full_log</options>\n    <description>The resource was discovered\
    \ but its configuration was not recorded since the recorder excludes the recording of resources of this type.\
    \ AWS config - history:  [$(aws.awsAccountId) $(aws.awsRegion)] [$(aws.resourceType)]: $(aws.resourceId) ($(aws.configurationItemStatus)).</description>\n\
    \    <group>aws_config,aws_config_history,</group>\n  </rule>\n\n  <rule id=\"80456\" level=\"3\">\n    <if_sid>80451</if_sid>\n\
    \    <field name=\"aws.configurationItemStatus\">ResourceDeleted</field>\n    <options>no_full_log</options>\n\
