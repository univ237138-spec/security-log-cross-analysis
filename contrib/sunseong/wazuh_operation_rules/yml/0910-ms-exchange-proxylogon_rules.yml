  original_xml: "<!--\n  Copyright (C) 2015, Wazuh Inc.\n-->\n\n<!--\n  Rules \n    Microsoft exchange ID: 91000\
    \ - 91008\n\n  Reference:\n    Based on https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers/\n\
    -->\n\n<group name=\"ms,exchange,\">\n\n  <rule id=\"91000\" level=\"12\">\n    <if_group>sysmon_event1</if_group>\n\
    \    <field name=\"win.eventdata.parentImage\">\\\\UMWorkerProcess.exe</field>\n    <field name=\"win.eventdata.originalFileName\"\
    \ negate=\"yes\">werfault.exe|wermgr.exe</field>\n    <description>UMWorkerProcess.exe spawned unexpected processes.\
    \ Possible malicious activity.</description>\n    <mitre>\n      <id>T1210</id>\n    </mitre>\n  </rule>\n\n\
    \  <rule id=\"91001\" level=\"12\">\n    <if_group>sysmon_event_11</if_group>\n    <field name=\"win.eventdata.image\"\
    >\\\\UMWorkerProcess.exe</field>\n    <field name=\"win.eventdata.targetFilename\" negate=\"yes\">CacheCleanup.bin$|.txt$|.log$|.cfg$|cleanup.bin$</field>\n\
    \    <description>UMWorkerProcess.exe spawned creating abnormal files. Possible malicious activity.</description>\n\
    \    <mitre>\n      <id>T1210</id>\n    </mitre>\n  </rule>\n\n  <!--\n    CVE-2021-26855 (ProxyLogon) exploitation\
    \ can be detected via the following Exchange HttpProxy logs:\n    These logs are located in the following directory:\
    \ %PROGRAMFILES%\\Microsoft\\Exchange Server\\V15\\Logging\\HttpProxy\n    Exploitation can be identified by\
    \ searching for log entries where the AuthenticatedUser is empty and the AnchorMailbox contains the pattern\
    \ of ServerInfo~*/*\n  -->\n  <rule id=\"91002\" level=\"12\">\n    <decoded_as>HTTPProxyLog</decoded_as>\n\
    \    <regex type=\"pcre2\">,,[^,]*,ServerInfo~[^,]*/[^,]*</regex>\n    <description>MS Exchange - Possible ProxyLogon\
    \ vulnerability exploitation (CVE-2021-26855).</description>\n    <mitre>\n      <id>T1210</id>\n    </mitre>\n\
    \  </rule>\n\n  <!--\n    CVE-2021-27065  is a post-authentication arbitrary file write vulnerability in Exchange.\
    \ If HAFNIUM could authenticate\n    with the Exchange server then they could use this vulnerability to write\
    \ a file to any path on the server.\n    They could authenticate by exploiting the CVE-2021-26855 SSRF vulnerability\
    \ or by compromising a legitimate\n    admin’s credentials.\n  -->\n  <rule id=\"91003\" level=\"12\">\n   \
    \ <decoded_as>ECPServerLog</decoded_as>\n    <regex type=\"pcre2\">Set-.+VirtualDirectory.+?Url.+\\<\\w+.*\\\
    >.*?\\<\\/\\w+\\>.+?VirtualDirectory</regex>\n    <description>MS Exchange - Possible ProxyLogon vulnerability\
    \ exploitation (CVE-2021-27065).</description>\n    <mitre>\n      <id>T1210</id>\n    </mitre>\n  </rule>\n\
    \n  <!--\n    CVE-2021-26857 is an insecure deserialization vulnerability in the Unified Messaging service.\
    \ Insecure deserialization\n    is where untrusted user-controllable data is deserialized by a program. Exploiting\
    \ this vulnerability gave HAFNIUM the\n    ability to run code as SYSTEM on the Exchange server. This requires\
    \ administrator permission or another vulnerability\n    to exploit.\n  -->\n  <rule id=\"91004\" level=\"0\"\
    >\n    <if_sid>60602</if_sid>\n    <field name=\"win.system.providerName\">^MSExchange Unified Messaging$</field>\n\
    \    <options>no_full_log</options>\n    <description>Filtering MSExchange Unified Message error events.</description>\n\
    \  </rule>\n\n  <rule id=\"91005\" level=\"12\">\n    <if_sid>91004</if_sid>\n    <field name=\"win.system.message\"\
    >System.InvalidCastException</field>\n    <description>MS Exchange - Possible deserialization exploitation (CVE-2021-26857).</description>\n\
    \    <mitre>\n      <id>T1068</id>\n    </mitre>\n  </rule>\n\n  <rule id=\"91006\" level=\"12\">\n    <if_group>sysmon_event1</if_group>\n\
    \    <field name=\"win.eventdata.originalFileName\">cmd.exe|powershell.exe|powershell_ISE.exe</field>\n    <field\
    \ name=\"win.eventdata.commandLine\">Add-PSSnapin\\s+Microsoft.Exchange.Powershell.Snapin</field>\n    <description>Powershell\
    \ initializing MS Exchange snapin. Possible mailbox data dump</description>\n    <mitre>\n      <id>T1114</id>\n\
    \      <id>T1059</id>\n    </mitre>\n  </rule>\n\n  <rule id=\"91007\" level=\"12\">\n    <if_group>sysmon_event1</if_group>\n\
    \    <field name=\"win.eventdata.originalFileName\">powershell.exe|powershell_ISE.exe</field>\n    <field name=\"\
    win.eventdata.commandLine\" type=\"pcre2\">\\$client = New-Object System\\.Net\\.Sockets\\.TCPClient</field>\n\
    \    <description>Possible Nishang Invoke-PowerShellTcpOneLine reverse shell script execution</description>\n\
    \    <mitre>\n      <id>T1210</id>\n      <id>T1588</id>\n      <id>T1059</id>\n    </mitre>\n  </rule>\n\n\
    </group>\n"
