    18,3/10/2009,19:59:11,Expired,192.168.10.205,,,\n17,3/10/2009,23:59:16,DNS record not deleted,192.168.10.205,,,\n\
    -->\n\n<group name=\"windows,dhcp,\">\n  <rule id=\"6300\" level=\"0\">\n    <decoded_as>ms-dhcp-ipv4</decoded_as>\n\
