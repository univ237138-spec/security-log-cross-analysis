    \ modify it under the terms of GPLv2.\n-->\n\n<!--Server 2003 and 2008 IPv4 Event ID  Meaning\n00        The\
    \ log was started.\n01        The log was stopped.\n02        The log was temporarily paused due to low disk\
    \ space.\n10        A new IP address was leased to a client.\n11        A lease was renewed by a client.\n12\
    \        A lease was released by a client.\n13        An IP address was found to be in use on the network.\n\
    14        A lease request could not be satisfied because the scope's address pool was exhausted.\n15       \
    \ A lease was denied.\n16        A lease was deleted.\n17        A lease was expired.\n18\tA lease was expired\
    \ and DNS records were deleted. (Server 2008 Only)\n20        A BOOTP address was leased to a client.\n21  \
    \      A dynamic BOOTP address was leased to a client.\n22        A BOOTP request could not be satisfied because\
    \ the scope's  address pool for BOOTP was exhausted.\n23        A BOOTP IP address was deleted after checking\
    \ to see it was not in use.\n24        IP address cleanup operation has began.\n25        IP address cleanup\
    \ statistics.\n30        DNS update request to the named DNS server\n31        DNS update failed\n32       \
    \ DNS update successful\n33\tPacket dropped due to NAP policy. Server 2008 Only)\n50+       Codes above 50 are\
    \ used for Rogue Server Detection information.\n-->\n\n<!--Server 2003 IPv4 Log Sample\nID,Date,Time,Description,IP\
    \ Address,Host Name,MAC Address\n24,3/10/2009,0:00:46,Database Cleanup Begin,,,,\n31,3/10/2009,0:00:46,DNS Update\
