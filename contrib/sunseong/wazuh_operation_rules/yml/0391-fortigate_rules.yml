        <group>firewall_drop,gdpr_IV_35.7.d,hipaa_164.312.b,nist_800_53_AU.6,pci_dss_10.6.1,</group>
      </rule>

      <rule id="81635" level="3" frequency="16" timeframe="45" ignore="240">
        <if_matched_sid>81620</if_matched_sid>
