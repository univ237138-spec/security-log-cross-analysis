  original_xml: |
    <!--
      -  Zeus rules
      -  Author: Daniel Cid.
      -  Contributed by: Chris Buckley <chris at cjbuckley.net>
      -  Updated by Wazuh, Inc.
      -  Copyright (C) 2015, Wazuh Inc.
