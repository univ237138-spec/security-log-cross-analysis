        <group>syscheck,fim_db_state,gdpr_IV_35.7.d,</group>
      </rule>

      <rule id="241" level="12">
        <if_sid>230</if_sid>
        <field name="alert_type">full</field>
        <field name="fim_db_table">registry_data</field>
        <description>The maximum limit of registry values monitored has been reached. At this moment there are $(values_count) registry values and the limit is $(registry_limit). From this moment some events can be lost. You can modify this setting in the centralized configuration or locally in the agent.</description>
        <group>syscheck,fim_db_state,gdpr_IV_35.7.d,</group>
      </rule>

      <rule id="242" level="3">
