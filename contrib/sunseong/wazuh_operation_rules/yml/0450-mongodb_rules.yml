  original_xml: "<!--\n  -  MongoDB rules\n  -  Created by Wazuh, Inc.\n  -  Copyright (C) 2015, Wazuh Inc.\n  -\
    \  This program is a free software; you can redistribute it and/or modify it under the terms of GPLv2.\n-->\n\
    \n<!-- ID: 85750 - 85999 -->\n\n<!--\nF\tFatal\nE\tError\nW\tWarning\nI\tInformational, for Verbosity Level\
    \ of 0\nD\tDebug, for All Verbosity Levels > 0\n-->\n\n<group name=\"mongodb,\">\n\n    <!--\n    2017-03-27T19:32:32.916+0200\
    \ Z MYCOMPONENT  [conn13388] Text\n    -->\n    <rule id=\"85750\" level=\"0\">\n        <decoded_as>mongodb</decoded_as>\n\
    \        <description>MongoDB messages</description>\n    </rule>\n\n    <!--\n    2017-03-27T19:32:32.916+0200\
    \ F MYCOMPONENT  [conn13388] Text\n    -->\n    <rule id=\"85751\" level=\"9\">\n        <if_sid>85750</if_sid>\n\
    \        <field name=\"mongodb.severity\">F</field>\n        <description>MongoDB: Fatal message</description>\n\
    \        <group>gdpr_IV_35.7.d,</group>\n    </rule>\n\n    <!--\n    2017-03-27T19:32:32.916+0200 E MYCOMPONENT\
    \  [conn13388] Text\n    -->\n    <rule id=\"85752\" level=\"5\">\n        <if_sid>85750</if_sid>\n        <field\
    \ name=\"mongodb.severity\">E</field>\n        <description>MongoDB: Error message</description>\n    </rule>\n\
    \n    <!--\n    2017-03-27T19:32:32.916+0200 W MYCOMPONENT  [conn13388] Text\n    -->\n    <rule id=\"85753\"\
    \ level=\"4\">\n        <if_sid>85750</if_sid>\n        <field name=\"mongodb.severity\">W</field>\n       \
    \ <description>MongoDB: Warning message</description>\n    </rule>\n\n    <!--\n    2017-03-27T19:32:32.916+0200\
    \ D MYCOMPONENT  [conn13388] Text\n    -->\n    <rule id=\"85754\" level=\"0\">\n        <if_sid>85750</if_sid>\n\
    \        <field name=\"mongodb.severity\">D</field>\n        <description>MongoDB: Debug message</description>\n\
    \    </rule>\n\n    <!--\n    2017-03-27T19:32:32.916+0200 I MYCOMPONENT  [conn13388] Text\n    -->\n    <rule\
    \ id=\"85755\" level=\"3\">\n        <if_sid>85750</if_sid>\n        <field name=\"mongodb.severity\">I</field>\n\
    \        <description>MongoDB: Informational message</description>\n    </rule>\n\n    <!--\n    2017-03-27T19:32:35.916+0200\
    \ I NETWORK  [initandlisten] connection accepted from 10.10.10.10:32768 #19309 (10 connections now open)\n \
    \   -->\n    <rule id=\"85756\" level=\"3\">\n        <if_sid>85755</if_sid>\n        <field name=\"mongodb.component\"\
    >NETWORK</field>\n        <match>connection accepted</match>\n        <description>MongoDB: Connection accepted</description>\n\
    \        <group></group>\n    </rule>\n\n    <!--\n    2017-03-27T19:32:33.916+0200 I NETWORK  [conn10000] end\
    \ connection 10.10.10.10:33658 (15 connections now open)\n    -->\n    <rule id=\"85757\" level=\"3\">\n   \
    \     <if_sid>85755</if_sid>\n        <field name=\"mongodb.component\">NETWORK</field>\n        <match>end\
    \ connection</match>\n        <description>MongoDB: End connection</description>\n        <group></group>\n\
    \    </rule>\n\n    <!--\n    2017-03-27T19:32:31.916+0200 I ACCESS   [conn10000] Successfully authenticated\
    \ as principal snapshots on myUser\n    -->\n    <rule id=\"85758\" level=\"3\">\n        <if_sid>85755</if_sid>\n\
    \        <field name=\"mongodb.component\">ACCESS</field>\n        <match>Successfully authenticated</match>\n\
    \        <description>MongoDB: Successfully authentication</description>\n        <mitre>\n            <id>T1078</id>\n\
    \        </mitre>\n        <group>authentication_success,pci_dss_10.2.5,gpg13_7.1,gpg13_7.2,gdpr_IV_32.2,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.7,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,</group>\n\
    \    </rule>\n\n    <!--\n    2016-03-31T15:07:04.807-0500 I ACCESS [conn3] SCRAM-SHA-1 authentication failed\
    \ for newdbUser on newdb from client 127.0.0.1 ; AuthenticationFailed SCRAM-SHA-1  authentication failed, storedKey\
    \ mismatch\n    -->\n    <rule id=\"85759\" level=\"4\">\n        <if_sid>85755</if_sid>\n        <field name=\"\
    mongodb.component\">ACCESS</field>\n        <match>authentication failed for</match>\n        <description>MongoDB:\
    \ Failed authentication</description>\n        <group>authentication_failed,pci_dss_10.2.4,pci_dss_10.2.5,gpg13_7.1,gdpr_IV_35.7.d,gdpr_IV_32.2,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.7,tsc_CC6.1,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,</group>\n\
    \    </rule>\n\n    <rule id=\"85760\" level=\"10\" frequency=\"8\">\n      <if_matched_sid>85759</if_matched_sid>\n\
    \      <same_source_ip />\n      <description>MongoDB: Multiple authentication failures.</description>\n   \
    \   <mitre>\n          <id>T1110</id>\n      </mitre>\n      <group>authentication_failures,pci_dss_10.2.4,pci_dss_10.2.5,pci_dss_11.4,gpg13_7.1,gdpr_IV_35.7.d,gdpr_IV_32.2,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.7,nist_800_53_SI.4,tsc_CC6.1,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,</group>\n\
    \    </rule>\n\n    <!--\n    2016-03-31T15:18:14.340-0500 I ACCESS   [conn7] Unauthorized not authorized on\
    \ admin to execute command { createUser:  \"mongoadmin2\", pwd: \"xxx\", roles: [ { role: \"userAdminAnyDatabase\"\
    ,  db: \"admin\" } ], digestPassword: false, writeConcern:   { w: \"majority\", wtimeout: 30000.0 } }\n    -->\n\
    \    <rule id=\"85761\" level=\"7\">\n        <if_sid>85755</if_sid>\n        <field name=\"mongodb.component\"\
    >ACCESS</field>\n        <regex>Unauthorized not authorized on \\S+ to execute command</regex>\n        <description>MongoDB:\
    \ Execute commands without the necessary privileges</description>\n        <group>pci_dss_10.2.5,gdpr_IV_35.7.d,gdpr_IV_32.2,</group>\n\
    \    </rule>\n\n</group>\n"
