  original_xml: |
    <!--
      -  Vsftpd rules
      -  Author: Daniel Cid.
      -  Author: Joachim Vorrath <joachim.vorrath@vorrath-net.de>.
      -  Author: Jorge Augusto Senger <jorge@br10.com.br>.
