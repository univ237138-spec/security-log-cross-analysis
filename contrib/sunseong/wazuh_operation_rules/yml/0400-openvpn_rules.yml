  original_xml: "<!--\n  -  OpenVPN rules\n  -  Author: Julio Camargo <julio.camargo@trustux.com.br>\n  -  Updated\
    \ by Wazuh, Inc.\n  -  Copyright (C) 2015, Wazuh Inc.\n  -  This program is a free software; you can redistribute\
    \ it and/or modify it under the terms of GPLv2.\n-->\n\n<!-- ID: 81800 - 81899 -->\n\n<group name=\"openvpn,\"\
    >\n    <rule id=\"81800\" level=\"0\">\n        <decoded_as>openvpn</decoded_as>\n        <description>OpenVPN\
    \ messages grouped.</description>\n    </rule>\n\n    <!--\n    Jul 21 18:31:19 fw01 openvpn[76395]: 200.200.200.200:17777\
    \ [chapolin] Peer Connection Initiated with [AF_INET]200.200.200.200:17777\n    -->\n    <rule id=\"81801\"\
    \ level=\"3\">\n        <if_sid>81800</if_sid>\n        <match>Peer Connection Initiated with</match>\n    \
    \    <description>OpenVPN: User logged in</description>\n        <mitre>\n            <id>T1078</id>\n     \
    \   </mitre>\n        <group>authentication_success,pci_dss_10.2.5,gpg13_7.1,gpg13_7.2,gdpr_IV_32.2,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.7,tsc_CC6.8,tsc_CC7.2,tsc_CC7.3,</group>\n\
    \    </rule>\n\n    <rule id=\"81802\" level=\"3\" frequency=\"3\" timeframe=\"60\">\n        <if_matched_sid>81801</if_matched_sid>\n\
    \        <user />\n        <description>OpenVPN: Concurrent connections</description>\n    </rule>\n\n    <!--\n\
    \    Jul 22 11:46:19 fw01 openvpn[43658]: 201.201.201.201:1194 TLS Auth Error: Auth Username/Password verification\
    \ failed for peer\n    Jul 22 13:10:29 fw01 openvpn[76395]: girafalez/202.202.202.202:1194 TLS Error: TLS key\
    \ negotiation failed to occur within 60 seconds (check your network connectivity)\n    Jul 22 13:10:29 fw01\
    \ openvpn[76395]: girafalez/202.202.202.202:1194 TLS Error: TLS handshake failed\n    -->\n    <rule id=\"81803\"\
    \ level=\"4\">\n        <if_sid>81800</if_sid>\n        <match>TLS Error|TLS Auth Error</match>\n        <description>OpenVPN:\
    \ Connection Certificate Failed</description>\n        <mitre>\n            <id>T1133</id>\n        </mitre>\n\
    \        <group>openvpn-error,gdpr_IV_35.7.d,</group>\n    </rule>\n\n    <rule id=\"81804\" level=\"4\" frequency=\"\
    3\" timeframe=\"60\">\n        <if_matched_sid>81803</if_matched_sid>\n        <description>OpenVPN: Certificate\
    \ failed - Possible revoked user</description>\n        <mitre>\n            <id>T1133</id>\n        </mitre>\n\
    \        <group>openvpn-error,gdpr_IV_35.7.d,gdpr_IV_32.2,</group>\n    </rule>\n\n<!--\n Author: Stuart Williams\
    \ <stwilliams@workforcesoftware.com>\n    Date: 2019-01-29\n    Note: Enhanced decoder rules to handle LDAP\
    \ integrated authentication\nComments: Not sure how useful the first entry is but will 'log' it - could be useful\
    \ in auditing numbers etc\n\nJan 28 14:25:49 VPN-SERVER-05892 openvpn: LDAP bind failed: Invalid credentials\
    \ (80090308: LdapErr: DSID-55555555, comment: AcceptSecurityContext error, data 775, v3839)\nJan 28 14:25:49\
    \ VPN-SERVER-05892 openvpn: Incorrect password supplied for LDAP DN \"CN=Harry T. Hacker,OU=business unit,OU=department,DC=domain,DC=com\"\
    .\n-->\n\n  <rule id=\"81805\" level=\"5\">\n    <if_sid>81800</if_sid>\n    <match>^LDAP bind failed:</match>\n\
    \    <description>OpenVPN LDAP Bind Failure: $(ldap_data.error_message)</description>\n    <group>pci_dss_10.2.5,gpg13_7.1,gpg13_7.2,gdpr_IV_32.2,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.7</group>\n\
    \  </rule>\n\n  <rule id=\"81806\" level=\"5\">\n    <if_sid>81800</if_sid>\n    <match>^Incorrect password\
    \ supplied for LDAP DN</match>\n    <description>OpenVPN LDAP Logon Failure: $(ldap_data.Username) [$(ldap_data.Department)]</description>\n\
    \    <group>pci_dss_10.2.5,gpg13_7.1,gpg13_7.2,gdpr_IV_32.2,hipaa_164.312.b,nist_800_53_AU.14,nist_800_53_AC.7,</group>\n\
    \  </rule>\n  \n</group>\n"
